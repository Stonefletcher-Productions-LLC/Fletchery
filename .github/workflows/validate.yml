name: Windows checks
# Runs only when started by hand (Actions > Windows checks > Run workflow), since 2026-11-18. On GitHub's Windows
# machines every push and PR cost double minutes: this workflow used $21.65 of the organisation's $18 of included
# compute in November, and the $0 budget then blocked every Actions run in the organisation, LifeShare's PR checks
# included. Fletchery's coder agents and merge rounds are retired (LifeShare Docs/BuildMachines.md, "Every PR is
# checked on push"), so its code changes rarely. To turn the automatic checks back on, restore the two lines below.
#   push:
#     branches: [main, 'codex/**']
#   pull_request:
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoProfile -STA -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Shared resource and process cleanup checks
        timeout-minutes: 6
        run: ./tools/TestLaneResources.ps1
      - name: Cancelled-job process cleanup checks
        timeout-minutes: 6
        run: ./tools/TestLaneProcesses.ps1
      - name: PowerShell 7 resource cleanup checks
        shell: pwsh
        run: ./tools/TestLaneResources.ps1
      - name: Local runner checks
        timeout-minutes: 6
        shell: pwsh
        run: node runner/test/TestRunner.cjs
      - name: Fletchery engine checks
        run: |
          $env:PYTHONUTF8 = '1'
          python fletchery/test_fletchery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_gate_lines.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout recovery and reload lifecycle checks
        run: |
          $env:PYTHONUTF8 = '1'
          python fletchery/test_round_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_github_dispatch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_github_retry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_fetch_retry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fletchery/test_feedback_excerpt.py
