name: Windows checks
# Runs only when started by hand (Actions > Windows checks > Run workflow), since 2026-11-18. On GitHub's Windows
# machines every push and PR cost double minutes: this workflow used $21.65 of the organisation's $18 of included
# compute in November, and the $0 budget then blocked every Actions run in the organisation, LifeShare's PR checks
# included. Fletchery's coder agents and merge rounds are retired (LifeShare Docs/BuildMachines.md, "Every PR is
# checked on push"), so its code changes rarely. To turn the automatic checks back on, restore the two lines below.
#   push:
#     branches: [main]
#   pull_request:
#
# Three jobs run side by side, so one slow part never hits another's time limit:
#   python  every fletchery/test_*.py, found by name (a new test file runs with no change here; a deleted one just
#           stops running). Each file runs on its own and the job fails if any file fails, after running them all.
#   screens the desktop window and phone portal browser checks (ui/, Playwright).
#   windows Fletchery.exe compiles, the reservation tool's process checks (Windows PowerShell and PowerShell 7), and
#           the local runner's checks.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Every fletchery/test_*.py
        run: |
          $env:PYTHONUTF8 = '1'
          $failed = @()
          foreach ($test in Get-ChildItem fletchery -Filter 'test_*.py' | Sort-Object Name) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            python $test.FullName
            $code = $LASTEXITCODE
            Write-Host ("{0} {1} ({2:n0} s)" -f $(if ($code -eq 0) { 'PASS' } else { "FAIL exit $code" }), $test.Name, $watch.Elapsed.TotalSeconds)
            if ($code -ne 0) { $failed += $test.Name }
          }
          if ($failed) { Write-Host "Failed: $($failed -join ', ')"; exit 1 }
  screens:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Desktop window and phone portal browser checks
        shell: pwsh
        run: |
          npm ci --prefix ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell -NoProfile -STA -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fletchery.exe compiles
        timeout-minutes: 5
        run: ./shell/Build-Fletchery.ps1
      - name: Shared resource and process cleanup checks
        timeout-minutes: 6
        run: ./tools/TestLaneResources.ps1
      - name: Cancelled-job process cleanup checks
        timeout-minutes: 6
        run: ./tools/TestLaneProcesses.ps1
      - name: PowerShell 7 resource cleanup checks
        timeout-minutes: 6
        shell: pwsh
        run: ./tools/TestLaneResources.ps1
      - name: Local runner checks
        timeout-minutes: 6
        shell: pwsh
        run: node runner/test/TestRunner.cjs
